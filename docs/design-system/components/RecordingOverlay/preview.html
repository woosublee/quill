<!-- @dsCard group="3 · 유기체" height=250 subtitle="녹음 상태 알약 · 항상 검정" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>RecordingOverlay</title></head>
<body>
<div class="q-stage" style="background:#5b6472">
<div><div class="q-pill w92"><div class="q-dots"><i class="on"></i><i></i><i></i></div></div><div class="q-cap">준비 중</div></div>
<div><div class="q-pill w92"><div class="q-wave"><i style="height:7.0px"></i><i style="height:9.9px"></i><i style="height:12.8px"></i><i style="height:15.0px"></i><i style="height:16.4px"></i><i style="height:15.0px"></i><i style="height:12.8px"></i><i style="height:9.9px"></i><i style="height:7.0px"></i></div></div><div class="q-cap">녹음 중(누르고 있기)</div></div>
<div><div class="q-pill w150"><div class="q-wave"><i style="height:5.5px"></i><i style="height:7.4px"></i><i style="height:9.4px"></i><i style="height:10.9px"></i><i style="height:11.9px"></i><i style="height:10.9px"></i><i style="height:9.4px"></i><i style="height:7.4px"></i><i style="height:5.5px"></i></div><span class="q-stop"></span></div><div class="q-cap">녹음 중(토글) · 정지</div></div>
<div><div class="q-pill w150"><span style="font-size:13px;font-weight:600">3:12</span><span class="q-stop"></span></div><div class="q-cap">hover → 경과 시간</div></div>
<div><div class="q-pill w180"><span class="q-lead"><span class="q-sym"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 2.8 2.7 2.7-7.4 7.4-3.3.6.6-3.3Z"/></svg></span></span><div class="q-wave"><i style="height:6.4px"></i><i style="height:8.9px"></i><i style="height:11.4px"></i><i style="height:13.3px"></i><i style="height:14.6px"></i><i style="height:13.3px"></i><i style="height:11.4px"></i><i style="height:8.9px"></i><i style="height:6.4px"></i></div></div><div class="q-cap">편집 모드</div></div>
<div><div class="q-pill w92"><div class="q-proc"><i style="height:7px;opacity:0.5"></i><i style="height:11px;opacity:0.7"></i><i style="height:16px;opacity:0.94"></i><i style="height:11px;opacity:0.7"></i><i style="height:7px;opacity:0.5"></i></div></div><div class="q-cap">처리 중</div></div>
<div><div class="q-pill wide"><div class="q-pill-msg"><span style="color:var(--status-recording)"><span class="q-sym"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="currentColor" stroke="none"/><path d="M8 4.8v3.8M8 10.8v.1" stroke="#fff"/></svg></span></span>마이크 입력이 없어요</div></div><div class="q-cap">오류</div></div>
<div><div class="q-pill w190"><div class="q-pill-msg update"><span class="q-sym"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="currentColor" stroke="none"/><path d="M8 4.8v5.6m-2.4-2.4L8 10.4 10.4 8" stroke="#000"/></svg></span>버전 1.2.3 사용 가능</div></div><div class="q-cap">업데이트</div></div>
<div><div class="q-notch"><div class="side l"><div class="q-wave"><i style="height:5.8px"></i><i style="height:7.9px"></i><i style="height:10.1px"></i><i style="height:11.7px"></i><i style="height:12.8px"></i><i style="height:11.7px"></i><i style="height:10.1px"></i><i style="height:7.9px"></i><i style="height:5.8px"></i></div></div><div class="hw"></div><div class="side r">3:12</div></div><div class="q-cap">노치 옆 배치</div></div>
</div>
</body>
</html>
