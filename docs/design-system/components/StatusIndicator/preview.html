<!-- @dsCard group="1 · 원자" height=90 subtitle="노트 상태 점·스피너" -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>StatusIndicator</title></head>
<body>
<div class="q-stage">
<div><span class="q-dot done"></span><div class="q-cap">완료 · 오디오만</div></div>
<div><span style="display:inline-flex;gap:4px;align-items:center"><span class="q-dot rec"></span><span class="q-timer">03:12</span></span><div class="q-cap">녹음 중</div></div>
<div><span class="q-spin"></span><div class="q-cap">전사 중</div></div>
<div><span style="color:var(--status-processing)"><span class="q-sym"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3.5v3.5h3.5"/><path d="M3.3 7A5 5 0 1 1 4.5 11.5"/></svg></span></span><div class="q-cap">복구됨</div></div>
<div><span class="q-dot fail"></span><div class="q-cap">실패</div></div>
<div><span style="color:var(--status-recording)"><span class="q-sym"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2 14.3 13H1.7Z" fill="currentColor" stroke="none"/><path d="M8 6.3v3.2M8 11.2v.1" stroke="#000" stroke-opacity=".55"/></svg></span></span><div class="q-cap">실패(색 구분 없이 보기)</div></div>
</div>
</body>
</html>
