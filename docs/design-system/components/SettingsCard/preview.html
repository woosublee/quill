<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>SettingsCard</title></head>
<body>
<div class="q-stage col" style="background:var(--surface-window);padding:24px;gap:20px">
<div class="q-card"><div class="hd"><span class="q-sym"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v5.5M4.8 4.2a5 5 0 1 0 6.4 0"/></svg></span>앱</div><div class="rows">
<label class="q-cb"><span class="box"></span>로그인 시 Quill 실행</label>
<label class="q-cb"><span class="box on"></span>메뉴 막대 아이콘 표시</label>
<div class="q-warnline"><span style="color:var(--status-processing)"><span class="q-sym"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2 14.3 13H1.7Z" fill="currentColor" stroke="none"/><path d="M8 6.3v3.2M8 11.2v.1" stroke="#000" stroke-opacity=".55"/></svg></span></span>시스템 설정에서 로그인 항목을 승인해야 해요.</div></div></div>
<div class="q-card"><div class="hd"><span class="q-sym"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h1.5M4.5 5.5v5M7 3.5v9M9.5 5.5v5M12 7v2M14 8h.5"/></svg></span>전사<span style="flex:1"></span><span class="q-sw on"></span></div><div class="rows"><span class="q-help" style="margin-top:-6px">음성을 텍스트로 변환해요.</span>
<div style="display:flex;flex-direction:column;gap:6px"><span class="q-field-label">모델</span><span class="q-popup">Whisper Large v3 Turbo (기기 내)<span class="q-sym"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5 8 9.5l3-3"/></svg></span></span></div>
<span class="q-help">기기 안에서 전사해요. 오디오가 밖으로 나가지 않아요.</span></div></div>
</div>
</body>
</html>
