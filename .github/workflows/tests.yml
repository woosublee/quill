name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-shards:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core tests
            target: test-core
          - name: Recording tests
            target: test-recording
          - name: Transcription tests
            target: test-transcription
          - name: App state tests
            target: test-app-state

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode and show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Run ${{ matrix.name }}
        run: make ${{ matrix.target }}

  localization:
    name: Localization bundle
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode and show toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.0.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Validate app localization bundle
        run: make localization-bundle-test CODESIGN_IDENTITY=-

  repository-validation:
    name: Repository validation
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository files
        run: make validate

      - name: Check changed files for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

  tests:
    name: Tests
    if: ${{ always() }}
    needs:
      - test-shards
      - localization
      - repository-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every test group
        env:
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          LOCALIZATION_RESULT: ${{ needs.localization.result }}
          VALIDATION_RESULT: ${{ needs.repository-validation.result }}
        run: |
          test "$TEST_SHARDS_RESULT" = "success"
          test "$LOCALIZATION_RESULT" = "success"
          test "$VALIDATION_RESULT" = "success"
