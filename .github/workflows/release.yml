name: Official Notarized Release

# Mirrors self-signed-release.yml, but signs with the Developer ID certificate
# and notarizes both the app and the DMG so new users do not see a Gatekeeper
# warning. Moving from the self-signed "Quill" identity to Developer ID changes
# the app's code-signing identity. Sparkle still accepts the update because the
# EdDSA key is unchanged, but macOS asks existing users to grant Accessibility,
# Screen Recording, and Microphone access again once. Installs from v0.1.5 or
# earlier predate Sparkle; their built-in updater requires the same signing
# identity, so those users must download Quill.dmg and reinstall once. Mention
# both in the CHANGELOG section of the first notarized release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
  # To re-enable automatic notarized releases from version tags:
  # push:
  #   tags:
  #     - "v*.*.*"

permissions:
  contents: write

# GitHub keeps at most one running and one pending job per concurrency group.
# Dispatch official stable releases one at a time; the shared group prevents
# two workflows from racing to update the GitHub latest pointer.
concurrency:
  group: quill-official-stable-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          APP_VERSION="$(make -s print-app-version)"
          BUILD_NUMBER="$(make -s print-build-number)"
          BUILD_TAG="$(make -s print-build-tag)"
          VERSION="${TAG#v}"

          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.1.0." >&2
            exit 1
          fi

          if [ "$TAG" != "$BUILD_TAG" ]; then
            echo "Workflow tag $TAG must match BUILD_TAG $BUILD_TAG from version.mk." >&2
            exit 1
          fi

          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Workflow version $VERSION must match APP_VERSION $APP_VERSION from version.mk." >&2
            exit 1
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists on origin. Choose a new release tag." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate stable release ordering
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validate_stable_release.py preflight \
            --repository "${{ github.repository }}" \
            --candidate-version "${{ steps.version.outputs.version }}" \
            --candidate-build "${{ steps.version.outputs.build_number }}"

      - name: Stamp app version
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Info.plist
          plutil -replace CFBundleVersion -string "${{ steps.version.outputs.build_number }}" Info.plist
          plutil -replace QuillBuildTag -string "${{ steps.version.outputs.tag }}" Info.plist

      - name: Build release notes from changelog
        id: release_notes
        run: |
          .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## Download"
            echo
            echo "**[Quill.dmg](https://github.com/woosublee/quill/releases/download/${{ steps.version.outputs.tag }}/Quill.dmg)** — Universal build for all Macs (Apple Silicon + Intel)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Required GitHub secrets:
      #   DEVELOPER_ID_CERTIFICATE_BASE64 — base64-encoded .p12 holding only the Developer ID Application identity
      #   DEVELOPER_ID_CERTIFICATE_PASSWORD — password for the .p12
      #   ASC_KEY_ID — App Store Connect API key ID for notarization
      #   ASC_ISSUER_ID — App Store Connect API issuer ID
      #   ASC_KEY_P8_BASE64 — base64-encoded App Store Connect API private key (.p8)
      #   SPARKLE_PRIVATE_KEY — Sparkle EdDSA private key for appcast signing
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          # Import Apple's Developer ID G2 intermediate so the identity is valid
          # without relying on the runner image.
          import_intermediate() {
            local name="$1" expected_sha256="$2"
            local path="$RUNNER_TEMP/$name.cer"
            curl -fsSL --retry 3 -o "$path" "https://www.apple.com/certificateauthority/$name.cer"
            echo "$expected_sha256  $path" | shasum -a 256 -c -
            security import "$path" -k "$KEYCHAIN_PATH"
            rm -f "$path"
          }
          import_intermediate DeveloperIDG2CA f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Developer ID chains to Apple's trusted roots, so `find-identity -v`
          # reports it. Use its SHA-1 so codesign never picks another identity,
          # and fail early instead of signing with an empty identity.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
          (umask 077 && echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH")
          xcrun notarytool store-credentials "notarytool-profile" \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Build universal
        env:
          GOOGLE_CALENDAR_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_ID }}
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET }}
        run: make ARCH=universal APP_NAME=Quill BUNDLE_ID=com.woosublee.quill CODESIGN_IDENTITY="$CODESIGN_IDENTITY" CODESIGN_TIMESTAMP=--timestamp APP_VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ steps.version.outputs.build_number }}" BUILD_TAG="${{ steps.version.outputs.tag }}" GOOGLE_CALENDAR_OAUTH_CLIENT_ID="$GOOGLE_CALENDAR_OAUTH_CLIENT_ID" GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET="$GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET"

      - name: Notarize universal app
        run: |
          ditto -c -k --keepParent build/Quill.app "$RUNNER_TEMP/Quill-notarize.zip"
          scripts/notarize.sh "$RUNNER_TEMP/Quill-notarize.zip"
          rm -f "$RUNNER_TEMP/Quill-notarize.zip"
          xcrun stapler staple build/Quill.app
          xcrun stapler validate build/Quill.app

      - name: Create universal DMG
        env:
          GOOGLE_CALENDAR_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_ID }}
          GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET }}
        run: make dmg ARCH=universal APP_NAME=Quill BUNDLE_ID=com.woosublee.quill CODESIGN_IDENTITY="$CODESIGN_IDENTITY" CODESIGN_TIMESTAMP=--timestamp APP_VERSION="${{ steps.version.outputs.version }}" BUILD_NUMBER="${{ steps.version.outputs.build_number }}" BUILD_TAG="${{ steps.version.outputs.tag }}" GOOGLE_CALENDAR_OAUTH_CLIENT_ID="$GOOGLE_CALENDAR_OAUTH_CLIENT_ID" GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET="$GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET"

      - name: Sign universal DMG
        run: codesign --force --timestamp --sign "$CODESIGN_IDENTITY" build/Quill.dmg

      - name: Notarize universal DMG
        run: |
          scripts/notarize.sh build/Quill.dmg
          xcrun stapler staple build/Quill.dmg
          xcrun stapler validate build/Quill.dmg

      - name: Verify Gatekeeper acceptance
        run: |
          spctl -a -vv -t open --context context:primary-signature build/Quill.dmg
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true; rmdir "$MOUNT_DIR" 2>/dev/null || true' EXIT
          hdiutil attach build/Quill.dmg -nobrowse -readonly -mountpoint "$MOUNT_DIR" >/dev/null
          xcrun stapler validate "$MOUNT_DIR/Quill.app"
          spctl -a -vv -t exec "$MOUNT_DIR/Quill.app"

      - name: Save universal DMG
        run: mv build/Quill.dmg Quill.dmg

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          DMG_PATH: Quill.dmg
          APPCAST_PATH: appcast.xml
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/generate-sparkle-appcast.sh

      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          AUTHORIZATION="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTHORIZATION"
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quill ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          generate_release_notes: false
          make_latest: true
          files: |
            Quill.dmg
            appcast.xml

      - name: Verify published latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/validate_stable_release.py verify-latest \
            --repository "${{ github.repository }}" \
            --expected-tag "${{ steps.version.outputs.tag }}" \
            --expected-version "${{ steps.version.outputs.version }}" \
            --expected-build "${{ steps.version.outputs.build_number }}" \
            --attempts 12 \
            --retry-delay 10

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12" "$RUNNER_TEMP/notary_api_key.p8" "$RUNNER_TEMP/Quill-notarize.zip"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH"
          fi
